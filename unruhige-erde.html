<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Unruhige Erde – Das Spiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#141428;--panel:#24244a;--ink:#f4f1e8;--y:#ffd400;--c:#ff9f1c;--sh:4px 4px 0 #000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#141428;z-index:10}body{margin:0;background:var(--bg);background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:16px 16px;color:var(--ink);font-family:"Pixelify Sans",ui-monospace,monospace;font-size:19px;line-height:1.45;min-height:100vh}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
.pix,.pixh,.btn,.hbtn,.lv,.ttype,.tt,.fbh,.node small,.wh small{font-family:"Press Start 2P",monospace}
#app{max-width:980px;margin:0 auto;padding:12px 14px 60px}
.panel{background:var(--panel);border:4px solid #000;box-shadow:var(--sh),inset 0 0 0 3px #3a3a6e;padding:20px;border-radius:2px}
.btn{background:var(--y);color:#111;border:4px solid #000;box-shadow:var(--sh);padding:14px 18px;font-size:12px;letter-spacing:1px;min-height:52px}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}.btn.big{font-size:15px;padding:18px 26px}.btn.red{background:#ff4d6d;color:#fff}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.small{font-size:15px;opacity:.75}.center{text-align:center}
/* start */
.start{min-height:90vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:28px}
.logo{text-align:center}.pix{font-size:28px;color:var(--y);text-shadow:4px 4px 0 #b3261e,8px 8px 0 #000}.pix.big{font-size:64px;color:#ff7a1a;margin-top:10px}
.logo .sub{font-family:"Press Start 2P";font-size:10px;margin-top:20px;opacity:.85;line-height:1.8}
.start .panel{max-width:520px;width:100%;text-align:center}.lbl{display:block;text-align:left;font-weight:600;margin:14px 0 6px}
input,textarea{width:100%;font-family:inherit;font-size:19px;background:#0d0d1d;color:var(--ink);border:3px solid #000;box-shadow:inset 3px 3px 0 #000;padding:12px;border-radius:0;margin-bottom:12px}
textarea{resize:vertical;min-height:170px}
/* hud */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:12px;background:#0d0d1d;border:4px solid #000;box-shadow:var(--sh);padding:8px 10px;margin-bottom:18px}
.hbtn{background:#3a3a6e;border:3px solid #000;padding:10px 10px;font-size:10px;color:#fff;min-height:44px}
.hrank{flex:1;min-width:0}.hrank b{font-size:17px}.lv{font-size:10px;background:var(--y);color:#111;padding:3px 6px}
.hrank small{display:block;font-size:13px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:12px;background:#000;border:2px solid #000;margin:4px 0}.bar i{display:block;height:100%;background:repeating-linear-gradient(90deg,#4ade80 0 8px,#22c55e 8px 10px)}
.hcoins{display:flex;align-items:center;gap:6px;font-family:"Press Start 2P";font-size:16px;color:var(--y)}
.coin{width:22px;height:22px;vertical-align:-4px;image-rendering:pixelated}
/* map */
.pixh{font-size:18px;color:var(--y);text-shadow:3px 3px 0 #000;line-height:1.5;margin:6px 0 10px;text-align:center}
.path{display:flex;flex-direction:column;gap:22px;margin:22px 0;position:relative}
.path:before{content:"";position:absolute;left:50%;top:20px;bottom:20px;border-left:6px dashed #3a3a6e;z-index:0}
.node{position:relative;z-index:1;width:min(560px,92%);display:flex;gap:16px;align-items:center;text-align:left;background:var(--panel);border:4px solid #000;box-shadow:var(--sh),inset 0 -6px 0 var(--c);padding:16px;border-radius:2px}
.node.l{align-self:flex-start}.node.r{align-self:flex-end}
.node:active{transform:translate(3px,3px)}
.node .ico{font-size:46px;width:72px;height:72px;display:grid;place-items:center;background:var(--c);border:4px solid #000;flex:none}
.node small{font-size:9px;color:var(--c)}.node b{display:block;font-size:21px}.node em{display:block;font-style:normal;opacity:.8;font-size:16px}
.nm{display:block;margin-top:6px;font-size:17px}.st{color:var(--y);letter-spacing:2px;margin-left:8px}
.node.locked{filter:grayscale(1);opacity:.6;cursor:not-allowed}.node .lk{color:#ff8fa3;font-size:14px;margin-top:4px}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:30px}
.lnk{background:none;border:2px solid #3a3a6e;padding:8px 12px;font-size:15px;opacity:.85}
/* world */
.wh{display:flex;gap:16px;align-items:center;margin-bottom:18px}.wh .ico{font-size:52px;background:var(--c);border:4px solid #000;box-shadow:var(--sh);width:84px;height:84px;display:grid;place-items:center;flex:none}
.wh .pixh{text-align:left;margin:4px 0}.wh small{font-size:9px;color:var(--c)}.wh p{margin:0;opacity:.85}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.tile{position:relative;text-align:left;background:var(--panel);border:4px solid #000;box-shadow:var(--sh);padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;min-height:170px}
.tile:active{transform:translate(3px,3px)}.tile.done{box-shadow:var(--sh),inset 0 0 0 3px #4ade80}.tile.part{box-shadow:var(--sh),inset 0 0 0 3px var(--y)}
.tn{position:absolute;top:-12px;left:-12px;background:var(--c);color:#111;border:3px solid #000;font-family:"Press Start 2P";font-size:11px;width:34px;height:34px;display:grid;place-items:center}
.tt{font-size:8px;color:var(--c);margin-left:22px}.tq{flex:1;font-size:16px}.tc{font-size:16px;color:var(--y)}
/* task */
.tbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px;font-family:"Press Start 2P";font-size:10px}
.ttype{margin-left:auto;background:var(--c);color:#111;padding:6px 8px;border:3px solid #000}
.q{font-size:22px;margin:0 0 6px;line-height:1.35}.info{font-size:15px;color:var(--y);margin-bottom:16px}
.hint{font-size:15px;opacity:.7;margin:10px 0 6px}.msg{color:#ff8fa3;text-align:center;min-height:1px;margin-top:8px}
.opts{display:grid;gap:10px}.opt{text-align:left;background:#1a1a36;border:3px solid #000;box-shadow:3px 3px 0 #000;padding:14px 16px;min-height:56px}
.opt.sel{background:#3a3a6e;outline:3px solid var(--y)}
.right{background:#14532d!important;outline:3px solid #4ade80!important}.wrong{background:#5c1324!important;outline:3px solid #ff4d6d!important}.miss{outline:3px dashed #4ade80!important}
.fix{display:inline-block;color:#86efac;font-size:15px;margin-left:8px}
.bank{display:flex;flex-wrap:wrap;gap:10px;padding:12px;background:#0d0d1d;border:3px dashed #3a3a6e;min-height:66px}
.chip{background:#f4f1e8;color:#111;border:3px solid #000;box-shadow:3px 3px 0 #000;padding:10px 12px;font-size:17px;font-weight:600;min-height:48px;text-align:left}
.chip.sel{background:var(--y);transform:translate(-2px,-2px);box-shadow:5px 5px 0 #000}
.chip.right,.chip.wrong{color:#fff}
.gaptext{line-height:2.6;font-size:19px}
.slot{display:inline-flex;align-items:center;vertical-align:middle;background:#0d0d1d;border:3px dashed var(--y);min-width:150px;min-height:48px;padding:2px;cursor:pointer}
.slot .chip{box-shadow:none;margin:0;width:100%}.slot.blk{display:flex;flex:1}
.mrows{display:grid;gap:10px;margin:12px 0}.mrow{display:flex;gap:12px;align-items:stretch}
.ml{flex:0 0 38%;background:#1a1a36;border:3px solid #000;padding:10px 12px;display:flex;align-items:center;font-weight:600}
.ml.num{flex:0 0 64px;justify-content:center}.badge{background:var(--y);color:#111;border:3px solid #000;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;font-family:"Press Start 2P";font-size:12px}
.mini{width:100%}.mini svg{width:100%;display:block;border:2px solid #000}
.diawrap{background:#000;border:4px solid #000;box-shadow:var(--sh);margin-bottom:10px}.dia{width:100%;display:block}
.cats{display:grid;grid-template-columns:repeat(var(--n),1fr);gap:10px;margin-bottom:6px}
.catcol{background:#1a1a36;border:3px solid #000;min-height:150px;display:flex;flex-direction:column;cursor:pointer}
.cath{background:var(--c);color:#111;font-weight:600;padding:8px;text-align:center;border-bottom:3px solid #000}
.catbody{display:flex;flex-direction:column;gap:8px;padding:8px;flex:1}.catbody .chip{font-size:15px}
.tfr{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:#1a1a36;border:3px solid #000;padding:10px 12px;margin-bottom:8px}.tfr>span:first-child{flex:1;min-width:200px}
.tfb button{width:56px;height:48px;border:3px solid #000;background:#3a3a6e;font-family:"Press Start 2P";font-size:13px;margin-left:6px}.tfb button.sel{background:var(--y);color:#111}
.sortl{list-style:none;padding:0;display:grid;gap:10px}.sortl li{display:flex;gap:10px;align-items:center;background:#1a1a36;border:3px solid #000;padding:10px}
.sn{font-family:"Press Start 2P";font-size:12px;color:var(--y);width:28px}.stx{flex:1}.sb{display:flex;flex-direction:column;gap:6px}
.sb button{width:52px;height:40px;background:#3a3a6e;border:3px solid #000}.sb button:disabled{opacity:.3}
.atl .tfb button{width:auto;min-width:92px;padding:0 10px;font-size:11px}.atl textarea{min-height:80px}.model{background:#0d0d1d;border:3px solid #3a3a6e;padding:14px;margin-top:12px}.model hr{border:0;border-top:2px dashed #3a3a6e}
.tag{display:inline-block;padding:2px 8px;margin:3px 2px;border:2px solid #000;font-size:15px}.tag.ok{background:#14532d}.tag.no{background:#3a3a6e;opacity:.8}
.fb{margin-top:18px;border:4px solid #000;padding:16px;text-align:center}.fb.good{background:#14532d}.fb.mid{background:#5a4a0a}.fb.low{background:#5c1324}
.fbh{font-size:16px;color:var(--y)}.fbh span{display:block;font-family:"Pixelify Sans";font-size:17px;color:#fff;margin-top:8px}
.gain{font-family:"Press Start 2P";font-size:16px;margin:12px 0;color:var(--y)}.gain .coin{width:26px;height:26px}.ex{text-align:left;background:#00000040;padding:10px;margin:8px 0}
.modal{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:20;padding:16px}.modal .panel{max-width:440px;width:100%;text-align:center;animation:pop .3s}
.bigico{font-size:64px}.rk{font-family:"Press Start 2P";font-size:15px;color:var(--y);line-height:1.6}
@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
.rain{position:fixed;top:40%;z-index:30;animation:rain 1.4s ease-out forwards;pointer-events:none}.rain .coin{width:34px;height:34px}
@keyframes rain{0%{transform:translateY(0) scale(.5);opacity:0}20%{opacity:1}100%{transform:translateY(-55vh) scale(1.2);opacity:0}}
@media(max-width:640px){body{font-size:17px}.pix.big{font-size:44px}.node{width:100%}.ml{flex-basis:44%}.cats{grid-template-columns:1fr}.q{font-size:19px}.hbtn{font-size:8px}}

{type:"gap",q:"Fülle die Lücken zu Wegeners Theorie.",text:"Alfred Wegener stellte {1912} seine Theorie vor. Danach gab es einen Urkontinent namens {Pangäa}, der vor ca. {200} Mio. Jahren zerbrach. Die leichten Kontinente aus {Sial} (Silizium + Aluminium) sollten durch eine dichtere Schicht aus {Sima} (Silizium + Magnesium) pflügen – wie {Eisberge} durch Packeis. Gebirge wie die Anden waren für ihn „{Bugwellen}“ der driftenden Kontinente. Weil sich die Kontinente horizontal bewegen, gehört seine Theorie zum {Mobilismus}.",extras:["Fixismus","1960","Gondwana"]},

const RANKS=[[0,"Steinchen"],[40,"Erdbeben-Lehrling"],[80,"Seismo-Scout"],[130,"Wegeners Assistent"],[200,"Platten-Puzzler"],[270,"Subduktions-Profi"],[340,"Vulkan-Expertin / Experte"],[410,"Meister/in der Plattentektonik"]];

// ===== ENGINE =====
const KEY="unruhigeErde_atlas_v1";
const TEACHER_CODE="geo-lehrkraft";
let S={name:"",best:{},att:{},sound:true,teacher:false};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
WORLDS.forEach((w,i)=>w.tasks.forEach((t,j)=>t.id=`w${i+1}t${j+1}`));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const norm=s=>String(s).toLowerCase().replace(/\s+/g," ").trim();
const maxC=t=>t.coins||(t.type==="open"?15:10);
const worldMax=w=>w.tasks.reduce((s,t)=>s+maxC(t),0);
const worldCoins=w=>w.tasks.reduce((s,t)=>s+(S.best[t.id]||0),0);
const total=()=>WORLDS.reduce((s,w)=>s+worldCoins(w),0);
const totalMax=()=>WORLDS.reduce((s,w)=>s+worldMax(w),0);
const rankIdx=c=>{let r=0;RANKS.forEach((x,i)=>{if(c>=x[0])r=i;});return r;};
const unlocked=i=>i===0||S.teacher||worldCoins(WORLDS[i-1])>=Math.ceil(.6*worldMax(WORLDS[i-1]));
const stars=w=>{const p=worldCoins(w)/worldMax(w);return p>=1?3:p>=.8?2:p>=.6?1:0;};
const COIN=`<svg class="coin" viewBox="0 0 16 16"><rect x="4" y="1" width="8" height="14" fill="#b8860b"/><rect x="2" y="3" width="12" height="10" fill="#b8860b"/><rect x="5" y="2" width="6" height="12" fill="#ffd400"/><rect x="3" y="4" width="10" height="8" fill="#ffd400"/><rect x="7" y="4" width="2" height="8" fill="#b8860b"/></svg>`;
const TYPE_NAMES={mc:"QUIZ",multi:"MEHRFACHWAHL",tf:"RICHTIG/FALSCH",gap:"LÜCKENTEXT",match:"ZUORDNEN",label:"SCHAUBILD BESCHRIFTEN",cat:"SORTIEREN",sort:"REIHENFOLGE",open:"ERKLÄREN",atlas:"ATLASARBEIT"};

// Sound
let AC=null;
function beep(seq){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;seq.forEach(([f,d])=>{const o=AC.createOscillator(),g=AC.createGain();o.type="square";o.frequency.value=f;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d);t+=d*.9;});}catch(e){}}
const SFX={ok:()=>beep([[660,.08],[880,.08],[1320,.14]]),bad:()=>beep([[220,.15],[160,.2]]),tap:()=>beep([[520,.04]]),lvl:()=>beep([[523,.1],[659,.1],[784,.1],[1047,.25]])};

function hud(){const c=total(),ri=rankIdx(c),next=RANKS[ri+1];const lo=RANKS[ri][0],hi=next?next[0]:totalMax();const p=next?Math.round((c-lo)/(hi-lo)*100):100;
return `<header class="hud"><button class="hbtn" onclick="go('map')" aria-label="Karte">◀ KARTE</button><div class="hrank"><span class="lv">LV ${ri+1}</span> <b>${esc(RANKS[ri][1])}</b><div class="bar"><i style="width:${p}%"></i></div><small>${next?`noch ${hi-c} Münzen bis „${esc(next[1])}“`:"Höchster Rang erreicht!"}</small></div><div class="hcoins">${COIN}<b>${c}</b></div></header>`;}

let VIEW="start",CUR=null;
function go(v,a,b){VIEW=v;const app=$("#app");app.innerHTML="";window.scrollTo(0,0);
 if(v==="start")return renderStart(app);
 if(v==="map")return renderMap(app);
 if(v==="world")return renderWorld(app,a);
 if(v==="task")return renderTask(app,a,b);}

function renderStart(app){app.innerHTML=`<div class="start"><div class="logo"><div class="pix">UNRUHIGE</div><div class="pix big">ERDE</div><div class="sub">DAS WIEDERHOLUNGS-SPIEL · GEOGRAFIE</div></div>
<div class="panel"><p>Sammle Münzen, steige im Rang auf und schalte alle fünf Welten frei – von Erdbeben bis Tsunami.</p>
<label class="lbl">Dein Spielername</label><input id="nm" maxlength="20" placeholder="z. B. Lava-Lea" value="${esc(S.name)}"><button class="btn big" id="go">▶ START</button>
<p class="small">Dein Fortschritt wird nur auf diesem Gerät gespeichert.</p></div></div>`;
 $("#go").onclick=()=>{S.name=$("#nm").value.trim();save();SFX.tap();go("map");};
 $("#nm").onkeydown=e=>{if(e.key==="Enter")$("#go").click();};}

function renderMap(app){let h=hud()+`<main class="map"><h1 class="pixh">${S.name?`HALLO, ${esc(S.name.toUpperCase())}!`:"WELTKARTE"}</h1><p class="center small">Schalte die nächste Welt frei, indem du 60 % der Münzen der vorherigen Welt sammelst.</p><div class="path">`;
 WORLDS.forEach((w,i)=>{const u=unlocked(i),st=stars(w);h+=`<button class="node ${i%2?"r":"l"} ${u?"":"locked"}" style="--c:${w.color}" ${u?`onclick="go('world',${i})"`:""}>
 <span class="ico">${u?w.icon:"🔒"}</span><span class="nt"><small>WELT ${i+1}</small><b>${esc(w.title)}</b><em>${esc(w.sub)}</em>
 <span class="nm">${COIN} ${worldCoins(w)} / ${worldMax(w)} <span class="st">${"★".repeat(st)}${"☆".repeat(3-st)}</span></span>${u?"":`<em class="lk">Benötigt ${Math.ceil(.6*worldMax(WORLDS[i-1]))} Münzen in Welt ${i}</em>`}</span></button>`;});
 h+=`</div><footer class="foot"><button class="lnk" onclick="toggleSound()">${S.sound?"🔊 Ton an":"🔇 Ton aus"}</button><button class="lnk" onclick="go('start')">✎ Name ändern</button><button class="lnk" onclick="askReset()">↺ Fortschritt löschen</button><button class="lnk" onclick="askTeacher()">🔑 Lehrkraft</button></footer></main>`;
 app.innerHTML=h;}
function toggleSound(){S.sound=!S.sound;save();go("map");}

function modal(html){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="panel">${html}</div>`;document.body.appendChild(m);return m;}
function askReset(){const m=modal(`<h2 class="pixh">ACHTUNG</h2><p>Willst du wirklich alle Münzen und deinen Rang löschen?</p><div class="row"><button class="btn" id="n">Abbrechen</button><button class="btn red" id="y">Löschen</button></div>`);
 m.querySelector("#n").onclick=()=>m.remove();m.querySelector("#y").onclick=()=>{S.best={};S.att={};save();m.remove();go("map");};}
function askTeacher(){const m=modal(`<h2 class="pixh">LEHRKRAFT</h2><p>${S.teacher?"Alle Welten sind freigeschaltet.":"Code eingeben, um alle Welten freizuschalten:"}</p>${S.teacher?"":`<input id="tc" placeholder="Code">`}<div class="row"><button class="btn" id="n">Schließen</button><button class="btn" id="y">${S.teacher?"Sperre wieder an":"OK"}</button></div>`);
 m.querySelector("#n").onclick=()=>m.remove();m.querySelector("#y").onclick=()=>{if(S.teacher)S.teacher=false;else if(norm(m.querySelector("#tc").value)===TEACHER_CODE)S.teacher=true;else{m.querySelector("p").textContent="Falscher Code.";return;}save();m.remove();go("map");};}

function renderWorld(app,i){const w=WORLDS[i];let h=hud()+`<main class="world" style="--c:${w.color}"><div class="wh"><span class="ico">${w.icon}</span><div><small>WELT ${i+1}</small><h1 class="pixh">${esc(w.title.toUpperCase())}</h1><p>${esc(w.sub)}</p></div></div><div class="grid">`;
 w.tasks.forEach((t,j)=>{const b=S.best[t.id]||0,m=maxC(t),done=b>=m;h+=`<button class="tile ${done?"done":b?"part":""}" onclick="go('task',${i},${j})"><span class="tn">${j+1}</span><span class="tt">${TYPE_NAMES[t.type]}</span><span class="tq">${esc(t.q)}</span><span class="tc">${COIN} ${b}/${m}${done?" ✓":""}</span></button>`;});
 h+=`</div></main>`;app.innerHTML=h;}

// ---- Aufgabentypen ----
function chip(txt){const c=document.createElement("button");c.className="chip";c.type="button";c.textContent=txt;c.dataset.v=txt;return c;}
function makeSlots(bank,slots,locked){let sel=null;
 const clear=()=>{if(sel)sel.classList.remove("sel");sel=null;};
 const toBank=c=>{bank.appendChild(c);};
 bank.addEventListener("click",e=>{const c=e.target.closest(".chip");if(!c||locked())return;SFX.tap();if(sel===c)return clear();clear();sel=c;c.classList.add("sel");});
 slots.forEach(s=>s.addEventListener("click",e=>{if(locked())return;const cur=s.querySelector(".chip");
  if(sel){SFX.tap();if(cur)toBank(cur);s.appendChild(sel);s.classList.add("filled");clear();}
  else if(cur){SFX.tap();toBank(cur);s.classList.remove("filled");}}));
}
function slotCheck(slots){let ok=0;slots.forEach(s=>{const c=s.querySelector(".chip"),a=s.dataset.ans;const r=c&&norm(c.dataset.v)===norm(a);s.classList.add(r?"right":"wrong");if(r)ok++;else{const k=document.createElement("span");k.className="fix";k.textContent="→ "+a;s.after(k);}});return ok/slots.length;}

 el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(el.dataset.lock)return;SFX.tap();el.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");pick=+b.dataset.i;});

 el.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(el.dataset.lock)return;SFX.tap();const i=+b.dataset.i;if(on.has(i)){on.delete(i);b.classList.remove("sel");b.textContent="☐ "+t.options[i];}else{on.add(i);b.classList.add("sel");b.textContent="☑ "+t.options[i];}});
 return{ready:()=>on.size>0,check(){let g=0,f=0;el.querySelectorAll(".opt").forEach(b=>{const i=+b.dataset.i,c=t.answers.includes(i);if(c){b.classList.add(on.has(i)?"right":"miss");if(on.has(i))g++;}else if(on.has(i)){b.classList.add("wrong");f++;}});return Math.max(0,(g-f)/t.answers.length);}};},

 el.querySelectorAll(".tfr").forEach(r=>r.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(el.dataset.lock)return;SFX.tap();r.querySelectorAll("button").forEach(x=>x.classList.remove("sel"));b.classList.add("sel");v[r.dataset.i]=b.dataset.v==="1";}));
 return{ready:()=>Object.keys(v).length===t.items.length,check(){let ok=0;el.querySelectorAll(".tfr").forEach(r=>{const i=r.dataset.i,c=v[i]===t.items[i][1];r.classList.add(c?"right":"wrong");if(c)ok++;else{const k=document.createElement("small");k.className="fix";k.textContent="→ "+(t.items[i][1]?"richtig":"falsch");r.appendChild(k);}});return ok/t.items.length;}};},
gap(t,el){const parts=t.text.split(/\{([^}]+)\}/);const ans=[];let h='<div class="gaptext">';parts.forEach((p,i)=>{if(i%2){ans.push(p);h+=`<span class="slot inl" data-ans="${esc(p)}"></span>`;}else h+=esc(p);});h+='</div><p class="hint">Tippe ein Wort an und dann die Lücke.</p><div class="bank"></div>';el.innerHTML=h;
 const bank=el.querySelector(".bank");shuffle(ans.concat(t.extras||[])).forEach(a=>bank.appendChild(chip(a)));const slots=[...el.querySelectorAll(".slot")];makeSlots(bank,slots,()=>el.dataset.lock);
 return{ready:()=>slots.every(s=>s.querySelector(".chip")),check:()=>slotCheck(slots)};},
match(t,el){const pairs=shuffle(t.pairs);let h='<div class="mrows">';pairs.forEach(([l,r])=>{const left=l.startsWith("@")?`<div class="mini">${SVG[l.slice(1)]}</div>`:esc(l);h+=`<div class="mrow"><div class="ml">${left}</div><div class="slot blk" data-ans="${esc(r)}"></div></div>`;});h+='</div><p class="hint">Tippe eine Karte an und dann das passende Feld.</p><div class="bank"></div>';el.innerHTML=h;
 const bank=el.querySelector(".bank");shuffle(t.pairs.map(p=>p[1]).concat(t.extras||[])).forEach(a=>bank.appendChild(chip(a)));const slots=[...el.querySelectorAll(".slot")];makeSlots(bank,slots,()=>el.dataset.lock);
 return{ready:()=>slots.every(s=>s.querySelector(".chip")),check:()=>slotCheck(slots)};},
label(t,el){let h=`<div class="diawrap">${SVG[t.svg]}</div><div class="mrows">`;t.labels.forEach((a,i)=>{h+=`<div class="mrow"><div class="ml num"><span class="badge">${i+1}</span></div><div class="slot blk" data-ans="${esc(a)}"></div></div>`;});h+='</div><p class="hint">Tippe einen Begriff an und dann die passende Nummer.</p><div class="bank"></div>';el.innerHTML=h;
 const bank=el.querySelector(".bank");shuffle(t.labels.concat(t.extras||[])).forEach(a=>bank.appendChild(chip(a)));const slots=[...el.querySelectorAll(".slot")];makeSlots(bank,slots,()=>el.dataset.lock);
 return{ready:()=>slots.every(s=>s.querySelector(".chip")),check:()=>slotCheck(slots)};},
cat(t,el){el.innerHTML=`<div class="cats" style="--n:${t.cats.length}">${t.cats.map((c,i)=>`<div class="catcol" data-c="${i}"><div class="cath">${esc(c)}</div><div class="catbody"></div></div>`).join("")}</div><p class="hint">Tippe eine Karte an und dann die passende Spalte.</p><div class="bank"></div>`;

sort(t,el){let order=shuffle(t.items.map((x,i)=>i));if(order.every((v,i)=>v===i))order.reverse();
 const draw=()=>{el.innerHTML=`<ol class="sortl">${order.map((v,p)=>`<li data-v="${v}"><span class="sn">${p+1}</span><span class="stx">${esc(t.items[v])}</span><span class="sb"><button data-d="-1" ${p===0?"disabled":""}>▲</button><button data-d="1" ${p===order.length-1?"disabled":""}>▼</button></span></li>`).join("")}</ol>`;
  el.querySelectorAll("li").forEach((li,p)=>li.querySelectorAll("button").forEach(b=>b.onclick=()=>{if(el.dataset.lock)return;SFX.tap();const q=p+ +b.dataset.d;[order[p],order[q]]=[order[q],order[p]];draw();}));};draw();
 return{ready:()=>true,check(){let ok=0;el.querySelectorAll("li").forEach((li,p)=>{const c=+li.dataset.v===p;li.classList.add(c?"right":"wrong");if(c)ok++;else{const s=document.createElement("small");s.className="fix";s.textContent=`→ gehört an Platz ${+li.dataset.v+1}`;li.querySelector(".stx").appendChild(s);}});return ok/order.length;}};},

 return{ready:()=>Object.keys(v).length===3&&ta.value.trim().length>=6,notReady:"Wähle für alle drei Gefahren eine Stufe aus und schreibe eine kurze Erklärung.",check(){let ok=0;

open(t,el){el.innerHTML=`<textarea id="ta" rows="7" placeholder="Schreibe hier deine Erklärung in ganzen Sätzen …"></textarea><p class="hint">Verwende die passenden Fachbegriffe! Danach siehst du eine Musterlösung.</p><div class="ores"></div>`;const ta=el.querySelector("#ta");
 return{ready:()=>ta.value.trim().length>=40,notReady:"Schreib noch etwas mehr (mindestens zwei Sätze).",check(){const v=norm(ta.value);ta.readOnly=true;let f=0;const hit=[],miss=[];t.keys.forEach(g=>{if(g.some(k=>v.includes(k))){f++;hit.push(g[0]);}else miss.push(g[0]);});
  el.querySelector(".ores").innerHTML=`<div class="model"><b>Fachbegriffe gefunden: ${f} von ${t.need} benötigten</b><br>${hit.map(x=>`<span class="tag ok">✓ ${esc(x)}…</span>`).join(" ")} ${miss.map(x=>`<span class="tag no">${esc(x)}…?</span>`).join(" ")}<hr><b>Musterlösung:</b><p>${esc(t.model)}</p><small>Vergleiche ehrlich: Hast du alles erklärt, was in der Musterlösung steht?</small></div>`;return Math.min(1,f/t.need);}};}
};

function renderTask(app,wi,ti){const w=WORLDS[wi],t=w.tasks[ti];CUR={wi,ti};const m=maxC(t),att=S.att[t.id]||0,best=S.best[t.id]||0;
 app.innerHTML=hud()+`<main class="task" style="--c:${w.color}"><div class="tbar"><button class="hbtn" onclick="go('world',${wi})">◀ WELT ${wi+1}</button><span>AUFGABE ${ti+1}/${w.tasks.length}</span><span class="ttype">${TYPE_NAMES[t.type]}</span></div>
 <div class="panel"><h2 class="q">${esc(t.q)}</h2><div class="info">${COIN} bis zu ${att?Math.round(m/2):m} Münzen${att?" (Wiederholung = halbe Münzen)":""} · bisher geholt: ${best}/${m}</div><div id="body"></div><div class="msg" id="msg"></div>
 <div class="row"><button class="btn big" id="chk">PRÜFEN</button></div><div id="fb"></div></div></main>`;
 const body=$("#body"),api=T[t.type](t,body);
 $("#chk").onclick=()=>{if(!api.ready()){$("#msg").textContent=api.notReady||"Bearbeite zuerst alle Teile der Aufgabe.";SFX.bad();return;}
  $("#msg").textContent="";body.dataset.lock="1";const f=api.check();const n=(S.att[t.id]||0);S.att[t.id]=n+1;
  const wasUnl=wi<WORLDS.length-1&&unlocked(wi+1);
  const award=Math.round(m*f*(n?0.5:1));const oldTotal=total(),oldRank=rankIdx(oldTotal);const gain=Math.max(0,award-best);if(award>best)S.best[t.id]=award;save();
  const pct=Math.round(f*100);(f>=.99?SFX.ok:f>=.5?SFX.tap:SFX.bad)();
  const last=ti===w.tasks.length-1;
  $("#chk").remove();
  $("#fb").innerHTML=`<div class="fb ${f>=.99?"good":f>=.5?"mid":"low"}"><div class="fbh">${f>=.99?"PERFEKT!":f>=.5?"GUT GEMACHT!":"NOCHMAL ÜBEN!"} <span>${pct} % richtig</span></div>
  <div class="gain">${gain?`+${gain} ${COIN}`:(S.best[t.id]>=m?"Alle Münzen schon geholt":"Keine neuen Münzen – dein bisher bestes Ergebnis zählt")}</div>${t.explain?`<p class="ex">💡 ${esc(t.explain)}</p>`:""}
  <div class="row"><button class="btn" onclick="go('task',${wi},${ti})">↺ NOCHMAL</button>${last?`<button class="btn" onclick="go('world',${wi})">ZUR WELT ▶</button>`:`<button class="btn" onclick="go('task',${wi},${ti+1})">WEITER ▶</button>`}</div></div>`;
  document.querySelector(".hud").outerHTML=hud();
  if(gain)coinRain(gain);
  const nr=rankIdx(total());if(nr>oldRank)setTimeout(()=>levelUp(nr),700);
  if(wi<WORLDS.length-1&&!wasUnl&&unlocked(wi+1))setTimeout(()=>unlockMsg(wi+1),nr>oldRank?1400:700);
  $("#fb").scrollIntoView({behavior:"smooth",block:"nearest"});};}
function unlockMsg(i){const w=WORLDS[i];SFX.lvl();const m=modal(`<div class="bigico">${w.icon}</div><h2 class="pixh">NEUE WELT!</h2><p>Welt ${i+1} „${esc(w.title)}“ ist jetzt freigeschaltet.</p><div class="row"><button class="btn" id="y">OK</button></div>`);m.querySelector("#y").onclick=()=>m.remove();}
function levelUp(r){SFX.lvl();const m=modal(`<div class="bigico">⭐</div><h2 class="pixh">LEVEL UP!</h2><p>Du bist jetzt <b>Level ${r+1}</b>:</p><p class="rk">${esc(RANKS[r][1])}</p><div class="row"><button class="btn" id="y">WEITER</button></div>`);m.querySelector("#y").onclick=()=>m.remove();}
function coinRain(n){for(let i=0;i<Math.min(n,12);i++){const c=document.createElement("div");c.className="rain";c.innerHTML=COIN;c.style.left=(10+Math.random()*80)+"%";c.style.animationDelay=(i*60)+"ms";document.body.appendChild(c);setTimeout(()=>c.remove(),1600);}}
go(S.name?"map":"start");

</script></body></html>
